" clip-path="url(#p592ef3da7c)" style="fill: #f0f5f8; stroke: #d6e0e6; stroke-width: 0.7; stroke-linejoin: miter"/>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203544" x="385.714286" y="227.31675" transform="rotate(-0 385.714286 227.31675)">4  Keep unique learned features</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(313.867215 253.158926)">Identity = family + layer + feature ID.</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(320.810575 262.127168)">Collapse repeated token positions.</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(347.713309 271.09541)">Keep layers distinct.</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(385.714286 280.063652)"/>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(313.455301 289.031895)">Omit embeddings, output/error nodes,</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(318.225419 298.000137)">and missing or duplicated node IDs.</text>
   </g>
  </g>
  <g id="axes_5">
   <g id="patch_6">
    <path d="M 34.992486 462.7584 
L 244.665557 462.7584 
