z
" clip-path="url(#pa88d1ebbca)" style="fill: #f0f5f8; stroke: #d6e0e6; stroke-width: 0.7; stroke-linejoin: miter"/>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203544" x="139.829021" y="367.50075" transform="rotate(-0 139.829021 367.50075)">5  Calculate one difference per fact</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(66.955974 393.342926)">Jaccard = shared / all distinct features.</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(139.829021 402.311168)"/>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(67.552459 411.27941)">Compare the starting question with its</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(60.236443 420.247652)">own rewording, then average overlap with</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(67.566521 429.215895)">ALL other included factual rewordings.</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(84.038982 438.184137)">Subtract the other-fact mean.</text>
   </g>
  </g>
  <g id="axes_6">
   <g id="patch_7">
    <path d="M 280.87775 462.7584 
L 490.550821 462.7584 
Q 493.68027 462.7584 493.68027 461.0952 
L 493.68027 357.9768 
Q 493.68027 356.3136 490.550821 356.3136 
L 280.87775 356.3136 
Q 277.748301 356.3136 277.748301 357.9768 
L 277.748301 461.0952 
Q 277.748301 462.7584 280.87775 462.7584 
z
" clip-path="url(#p46da294528)" style="fill: #f0f5f8; stroke: #d6e0e6; stroke-width: 0.7; stroke-linejoin: miter"/>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203544" x="385.714286" y="367.50075" transform="rotate(-0 385.714286 367.50075)">6  Summarize across facts</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(340.977372 388.858805)">Illustrative feature sets:</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(314.385184 397.827047)">{a, b, c} and {a, b, d} → 2 / 4 = 0.50.</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(319.505692 406.795289)">Illustrative other-fact mean = 0.30.</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(323.436747 415.763531)">Difference: 0.50 − 0.30 = +0.20.</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(385.714286 424.731773)"/>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(312.543583 433.700016)">Means, descriptive bootstrap intervals,</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(323.66702 442.668258)">and within-subject permutations.</text>
   </g>
  </g>
  <g id="text_13">
   <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(28.062992 487.233531)">Examples and scores are illustrative, not measured results. Invented name controls form a separate</text>
   <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(28.062992 495.072)">comparison, not the other-fact baseline. Facts are the summary units, not graph pairs or subsampling draws.</text>
  </g>
  <g id="text_14">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203544" x="28.062992" y="18.726281" transform="rotate(-0 28.062992 18.726281)">How questions become a feature-overlap comparison</text>
  </g>
 </g>
