   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203544" x="385.714286" y="87.13275" transform="rotate(-0 385.714286 87.13275)">2  Export attribution graphs</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(313.433036 121.943168)">Neuronpedia runs the model remotely.</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(304.212137 130.91141)">Save raw graphs, settings, and checksums.</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(385.714286 139.879652)"/>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(337.875419 148.847895)">No local model inference.</text>
   </g>
  </g>
  <g id="axes_3">
   <g id="patch_4">
    <path d="M 34.992486 322.5744 
L 244.665557 322.5744 
