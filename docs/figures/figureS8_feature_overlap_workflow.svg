" clip-path="url(#pd6bee13e0f)" style="fill: #f0f5f8; stroke: #d6e0e6; stroke-width: 0.7; stroke-linejoin: miter"/>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203544" x="139.829021" y="227.31675" transform="rotate(-0 139.829021 227.31675)">3  Apply inclusion rules</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(93.02199 253.158926)">All four graphs available.</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(77.448943 262.127168)">Both factual top next tokens give</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(84.777264 271.09541)">a complete accepted answer.</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(77.089764 280.063652)">Another included fact is available</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(71.263201 289.031895)">in the same model, subject, and set.</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(75.210076 298.000137)">Registered spellings are accepted.</text>
   </g>
  </g>
  <g id="axes_4">
   <g id="patch_5">
    <path d="M 280.87775 322.5744 
L 490.550821 322.5744 
