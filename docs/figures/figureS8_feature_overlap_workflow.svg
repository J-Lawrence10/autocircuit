   <g id="text_1">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203544" x="139.829021" y="87.13275" transform="rotate(-0 139.829021 87.13275)">1  Prepare four prompt roles</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(93.418084 112.974926)">Starting factual question</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(100.793865 121.943168)">Same fact, reworded</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(78.333123 130.91141)">Invented name, starting wording</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(91.403631 139.879652)">Invented name, reworded</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(139.829021 148.847895)"/>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203544" transform="translate(55.227849 157.816137)">Gold and zorium are development examples.</text>
   </g>
  </g>
