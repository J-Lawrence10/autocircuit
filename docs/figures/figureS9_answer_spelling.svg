   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203544" x="60.48" y="455.868" transform="rotate(-0 60.48 455.868)">Qwen3-4B: both history facts are included in Figure 2. Each uses the other as its comparison partner.</text>
  </g>
  <g id="text_32">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203544" x="60.48" y="472.752" transform="rotate(-0 60.48 472.752)">The flagship predictions are Maria and María; both name the same ship. The other question asks about Franz Ferdinand.</text>
  </g>
  <g id="text_33">
   <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203544" x="34.56" y="21.8055" transform="rotate(-0 34.56 21.8055)">History rewordings share more features than questions about another fact</text>
  </g>
 </g>
